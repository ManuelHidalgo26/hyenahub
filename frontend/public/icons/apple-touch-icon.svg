  <!-- H mark centered, sized for 180px -->
  <rect x="42" y="36" width="20" height="108" rx="5" fill="#f97316"/>
  <rect x="118" y="36" width="20" height="108" rx="5" fill="#f97316"/>
  <rect x="42" y="80" width="96" height="20" rx="4" fill="#f97316"/>
</svg>

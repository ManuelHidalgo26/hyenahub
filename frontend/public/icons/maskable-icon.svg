<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed background (maskable: safe zone is center 80%) -->
  <rect width="512" height="512" fill="#09090b"/>
  <!-- Safe zone circle hint (no border, just bg) -->
  <circle cx="256" cy="256" r="230" fill="#18181b"/>
  <!-- H letter mark — scaled down 15% to stay inside safe zone -->
  <rect x="168" y="172" width="44" height="168" rx="10" fill="#f97316"/>
  <rect x="300" y="172" width="44" height="168" rx="10" fill="#f97316"/>
  <rect x="168" y="244" width="176" height="44" rx="8" fill="#f97316"/>
</svg>
